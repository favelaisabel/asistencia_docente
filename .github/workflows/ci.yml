# Integración continua (Etapas 10 y 13 de MIDE-IA 2.0).
# Se ejecuta en cada push y pull request. Un cambio solo se integra a main con CI en verde.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: Análisis y pruebas Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Análisis estático
        run: flutter analyze
      - name: Pruebas
        run: flutter test

  reglas:
    name: Pruebas de reglas de seguridad (emulador)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/test_reglas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/test_reglas/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
